## Fluxo de teste manual completo

### A. Cadastro novo usuário
1. Acesse `/#/cliente/cadastro`
2. Preencha tudo (CPF válido, telefone com DDD, email único)
3. Submit → deve aparecer "Cadastro recebido! Enviamos link..."
4. Verifique email → clique link → cai em `/#/redefinir-senha`
5. Defina senha → redireciona para login
6. Login com telefone + senha → entra no dashboard

### B. Login existente
1. Acesse `/#/cliente/login`
2. Telefone + senha corretos → entra
3. Senha errada → "Telefone ou senha incorretos"
4. 5x errado → "Muitas tentativas" (15 min)

### C. Recuperar senha
1. Acesse `/#/cliente/recuperar`
2. Telefone cadastrado → "Se houver conta, enviamos link"
3. Telefone NÃO cadastrado → **mesma mensagem** (não revela existência)
4. 3x seguido → "Muitas tentativas" (60 min)
5. Link no email → `/#/redefinir-senha` → nova senha → login

### D. Tentar cadastrar duplicado
1. Mesmo CPF do usuário A → deve falhar (constraint `profiles_cpf_unico`)
2. Mesmo telefone → deve falhar (`profiles_phone_unico`)
3. Mesmo email → deve falhar (`profiles_email_unico` + Auth unique)
4. Mensagem no frontend: "Não foi possível concluir o cadastro. Confira os dados..."

---

## Problemas conhecidos para observar

| Cenário | Comportamento esperado | Bug conhecido |
|---------|------------------------|---------------|
| 2 cadastros simultâneos mesmo CPF | Um falha, outro passa | Race condition: pode criar user no Auth sem profile |
| Rate limit não limpa tabela | `auth_attempts` cresce indefinidamente | Só limpa no login sucesso (linha 73) |
| Erro de duplicado no signup | Mensagem genérica | Usuário não sabe qual campo duplicou |

