## netlify.toml (commit este arquivo)
```toml
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"  # não usado, mas bom ter

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
```

