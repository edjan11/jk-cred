# JK CRED — Setup de teste local com Supabase CLI

## 1. Instalar Supabase CLI
```bash
npm i -g supabase
# ou: scoop install supabase (Windows)
```

## 2. Login e link do projeto
```bash
supabase login
supabase link --project-ref SEU_PROJECT_REF
# Pegue o Project Ref em: https://supabase.com/dashboard/project/SEU_PROJECT/settings/general
```

## 3. Variáveis de ambiente local
Crie `.env.local` na raiz:
```env
SUPABASE_URL=https://SEU-PROJECT.supabase.co
SUPABASE_ANON_KEY=sua_anon_key_aqui
SUPABASE_SERVICE_ROLE_KEY=sua_service_role_key_aqui
SITE_URL=http://localhost:8888
```

## 4. Subir Edge Function localmente
```bash
supabase functions serve acesso-cliente --env-file .env.local
# Roda em http://localhost:54321/functions/v1/acesso-cliente
```

## 5. Subir frontend local (Netlify CLI)
```bash
npm i -g netlify-cli
netlify dev
# Roda em http://localhost:8888
# O Netlify CLI lê netlify.toml e injeta as env vars no build
```

## 6. Rodar testes automatizados
```bash
# Testando Edge Function local
TEST_BASE=http://localhost:54321/functions/v1/acesso-cliente node test-auth.js

# Testando via Netlify Functions (se configurado)
TEST_BASE=http://localhost:8888/.netlify/functions/acesso-cliente node test-auth.js
```

## 7. Testar cadastro duplicado (no navegador)
1. Abra http://localhost:8888/#/cliente/cadastro
2. Abra DevTools → Console
3. Cole o código impresso pelo `test-auth.js` no final
4. Observe se bloqueia corretamente

