## Checklist antes de testar

- [ ] Migrations rodadas no Supabase (SQL Editor): `001_schema.sql` + `003_loans.sql`
- [ ] Primeiro admin criado: `insert into admin_users (user_id) select id from auth.users where email = 'seu@email.com';`
- [ ] Edge Function deployada: `supabase functions deploy acesso-cliente`
- [ ] `SITE_URL` configurada nas vars da Edge Function (Supabase Dashboard → Functions → acesso-cliente → Settings)
- [ ] Netlify conectado, env vars `SUPABASE_URL` e `SUPABASE_ANON_KEY` definidas
- [ ] `.env.local` criado com as mesmas chaves

